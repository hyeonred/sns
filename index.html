<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NYAU</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#DB3768;--primary-dark:#b02d54;--primary-light:#f06090;--primary-bg:#fff0f4;--primary-pale:#fde8ef;--dark:#1a0a10;--gray:#8a7a80;--light-gray:#f5f0f2;--border:#ebd5dc;--white:#ffffff;--danger:#e03333;--success:#2ecc71;--shadow-sm:0 2px 8px rgba(219,55,104,0.08);--nav-h:60px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--light-gray);color:var(--dark);min-height:100vh;overflow-x:hidden;}

/* AUTH */
#auth-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#fff0f4 0%,#ffd6e5 50%,#ffb3cc 100%);padding:20px;}
.auth-logo{margin-bottom:8px;}.auth-logo img{height:80px;object-fit:contain;}
.auth-tagline{color:var(--gray);font-size:.85rem;margin-bottom:32px;letter-spacing:.5px;}
.auth-card{background:var(--white);border-radius:24px;padding:36px 32px;width:100%;max-width:400px;box-shadow:0 8px 40px rgba(219,55,104,0.18);}
.auth-tabs{display:flex;margin-bottom:28px;border-bottom:2px solid var(--border);}
.auth-tab{flex:1;padding:10px;text-align:center;font-weight:700;font-size:.95rem;cursor:pointer;color:var(--gray);border-bottom:3px solid transparent;margin-bottom:-2px;transition:.2s;}
.auth-tab.active{color:var(--primary);border-bottom-color:var(--primary);}
.auth-form{display:none;flex-direction:column;gap:14px;}
.auth-form.active{display:flex;}
.auth-form input{padding:13px 16px;border:2px solid var(--border);border-radius:12px;font-size:.95rem;font-family:inherit;transition:.2s;outline:none;background:var(--primary-bg);}
.auth-form input:focus{border-color:var(--primary);background:var(--white);}
.auth-btn{padding:14px;background:var(--primary);color:var(--white);border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;transition:.2s;letter-spacing:.5px;}
.auth-btn:hover{background:var(--primary-dark);transform:translateY(-1px);}
.auth-msg{font-size:.82rem;color:var(--danger);text-align:center;min-height:16px;}
.remember-row{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--gray);cursor:pointer;}
.remember-row input[type=checkbox]{accent-color:var(--primary);width:16px;height:16px;cursor:pointer;}

/* APP */
#app{display:none;max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:var(--white);}
.top-nav{position:sticky;top:0;z-index:100;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px;height:52px;box-shadow:var(--shadow-sm);}
.top-logo{display:flex;align-items:center;gap:8px;}
.top-logo img{height:28px;object-fit:contain;}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--white);border-top:1px solid var(--border);display:flex;z-index:100;height:var(--nav-h);box-shadow:0 -4px 20px rgba(219,55,104,0.08);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;cursor:pointer;color:var(--gray);font-size:.65rem;font-weight:500;transition:.2s;font-family:inherit;}
.nav-btn.active{color:var(--primary);}
.nav-btn svg{width:22px;height:22px;}
.nav-upload{background:var(--primary)!important;border-radius:50%!important;width:48px!important;height:48px!important;margin-top:-16px!important;box-shadow:0 4px 16px rgba(219,55,104,0.4)!important;color:var(--white)!important;flex:0 0 48px!important;}
.nav-upload svg{width:24px;height:24px;}
.notif-dot{position:relative;}
.notif-dot .dot{position:absolute;top:0;right:0;width:8px;height:8px;background:var(--primary);border-radius:50%;display:none;}

/* PAGES */
.page{display:none;padding-bottom:calc(var(--nav-h) + 20px);}
.page.active{display:block;}

/* STORIES */
.stories-bar{display:flex;gap:12px;padding:14px 16px;overflow-x:auto;border-bottom:1px solid var(--border);scrollbar-width:none;}
.stories-bar::-webkit-scrollbar{display:none;}
.story-item{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;flex-shrink:0;}
.story-avatar{width:56px;height:56px;border-radius:50%;border:3px solid var(--primary);padding:2px;background:var(--white);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;color:var(--white);overflow:hidden;}
.story-name{font-size:.72rem;color:var(--dark);font-weight:500;max-width:60px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* POST CARD */
.post-card{background:var(--white);border-bottom:1px solid var(--border);padding:16px;}
.post-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:relative;}
.post-avatar{width:40px;height:40px;border-radius:50%;background:var(--primary);color:var(--white);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem;overflow:hidden;flex-shrink:0;cursor:pointer;border:2px solid var(--primary-light);}
.post-avatar img{width:100%;height:100%;object-fit:cover;}
.post-meta{flex:1;}
.post-nickname{font-weight:700;font-size:.92rem;cursor:pointer;}
.post-nickname:hover{color:var(--primary);}
.post-date{font-size:.75rem;color:var(--gray);}
.post-body{font-size:.93rem;line-height:1.6;margin-bottom:10px;white-space:pre-wrap;word-break:break-word;}
.post-retweet-label{font-size:.78rem;color:#17a2b8;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:4px;}
.post-images{display:flex;gap:8px;margin-bottom:10px;}
.post-images img{flex:1;max-height:200px;object-fit:cover;cursor:pointer;border-radius:8px;}
.post-actions{display:flex;gap:0;border-top:1px solid var(--border);padding-top:10px;}
.post-act-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;border:none;background:none;cursor:pointer;padding:6px 4px;font-size:.8rem;color:var(--gray);font-family:inherit;transition:.15s;border-radius:8px;}
.post-act-btn:hover{background:var(--primary-bg);color:var(--primary);}
.post-act-btn.liked{color:var(--primary);}
.post-act-btn.disliked{color:#e03333;}
.post-act-btn.retweeted{color:#17a2b8;}
.post-act-btn svg{width:16px;height:16px;}
.post-deleted{color:var(--danger);font-size:.88rem;font-weight:600;font-style:italic;padding:8px 0;}
.post-deleted-user{color:var(--gray);font-size:.88rem;font-style:italic;padding:8px 0;}
.admin-badge{background:var(--primary);color:var(--white);font-size:.65rem;padding:2px 6px;border-radius:20px;font-weight:700;margin-left:4px;}
.sub-admin-badge{background:#9b59b6;color:var(--white);font-size:.65rem;padding:2px 6px;border-radius:20px;font-weight:700;margin-left:4px;}

/* THREE DOTS */
.post-menu-wrap{position:relative;margin-left:auto;}
.post-dots-btn{border:none;background:none;cursor:pointer;color:var(--gray);padding:6px 8px;border-radius:8px;transition:.15s;font-size:1.1rem;display:flex;align-items:center;}
.post-dots-btn:hover{background:var(--primary-bg);color:var(--primary);}
.post-dropdown{position:absolute;right:0;top:100%;background:var(--white);border:1px solid var(--border);border-radius:12px;min-width:120px;z-index:50;box-shadow:0 4px 20px rgba(0,0,0,.12);overflow:hidden;display:none;}
.post-dropdown.open{display:block;animation:fadeIn .15s ease;}
.post-dropdown-item{padding:11px 16px;font-size:.88rem;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.15s;font-family:inherit;border:none;background:none;width:100%;text-align:left;font-weight:500;}
.post-dropdown-item:hover{background:var(--primary-bg);}
.post-dropdown-item.danger{color:var(--danger);}
.post-dropdown-item.danger:hover{background:#fff0f0;}
.comment-menu-wrap{position:relative;margin-left:auto;}
.comment-dots-btn{border:none;background:none;cursor:pointer;color:var(--gray);padding:2px 6px;border-radius:4px;font-size:1rem;display:flex;align-items:center;}
.comment-dots-btn:hover{color:var(--primary);}
.comment-dropdown{position:absolute;right:0;top:100%;background:var(--white);border:1px solid var(--border);border-radius:10px;min-width:100px;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.1);overflow:hidden;display:none;}
.comment-dropdown.open{display:block;animation:fadeIn .15s ease;}
.comment-dropdown-item{padding:9px 14px;font-size:.82rem;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s;font-family:inherit;border:none;background:none;width:100%;text-align:left;font-weight:500;}
.comment-dropdown-item:hover{background:var(--primary-bg);}
.comment-dropdown-item.danger{color:var(--danger);}
.comment-dropdown-item.danger:hover{background:#fff0f0;}

/* COMMENTS */
.comments-section{padding:12px 16px;border-bottom:6px solid var(--light-gray);}
.comments-list{margin-top:10px;display:flex;flex-direction:column;gap:10px;}
.comment-item{display:flex;gap:8px;}
.comment-avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-light);color:var(--white);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;flex-shrink:0;overflow:hidden;cursor:pointer;}
.comment-avatar img{width:100%;height:100%;object-fit:cover;}
.comment-body{flex:1;background:var(--primary-bg);border-radius:12px;padding:10px 12px;}
.comment-nick{font-weight:700;font-size:.82rem;cursor:pointer;}
.comment-nick:hover{color:var(--primary);}
.comment-text{font-size:.88rem;margin:4px 0;white-space:pre-wrap;word-break:break-word;}
.comment-date{font-size:.72rem;color:var(--gray);}
.comment-acts{display:flex;gap:8px;margin-top:6px;align-items:center;}
.comment-act{display:flex;align-items:center;gap:3px;font-size:.75rem;color:var(--gray);cursor:pointer;border:none;background:none;font-family:inherit;transition:.15s;padding:2px 4px;border-radius:4px;}
.comment-act:hover{color:var(--primary);background:var(--primary-pale);}
.comment-act.liked{color:var(--primary);}
.comment-act.disliked{color:#e03333;}
.comment-act.retweeted{color:#17a2b8;}
.comment-act svg{width:13px;height:13px;}
.comment-input-row{display:flex;gap:8px;margin-top:12px;align-items:center;}
.comment-input{flex:1;padding:10px 14px;border:2px solid var(--border);border-radius:20px;font-size:.88rem;font-family:inherit;outline:none;transition:.2s;background:var(--primary-bg);}
.comment-input:focus{border-color:var(--primary);background:var(--white);}
.comment-send{background:var(--primary);color:var(--white);border:none;border-radius:50%;width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s;}
.comment-send:hover{background:var(--primary-dark);}
.comment-send svg{width:16px;height:16px;}

/* SEARCH */
.search-bar-wrap{padding:14px 16px;position:sticky;top:52px;background:var(--white);z-index:50;border-bottom:1px solid var(--border);}
.search-bar{width:100%;padding:12px 16px 12px 42px;border:2px solid var(--border);border-radius:20px;font-size:.93rem;font-family:inherit;outline:none;background:var(--primary-bg);transition:.2s;}
.search-bar:focus{border-color:var(--primary);background:var(--white);}
.search-bar-icon{position:absolute;left:28px;top:50%;transform:translateY(-50%);color:var(--gray);}
.search-section-title{padding:12px 16px 6px;font-size:.78rem;font-weight:700;color:var(--gray);letter-spacing:.5px;}
.user-result-item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;transition:.15s;border-bottom:1px solid var(--border);}
.user-result-item:hover{background:var(--primary-bg);}
.user-result-avatar{width:44px;height:44px;border-radius:50%;background:var(--primary);color:var(--white);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;overflow:hidden;flex-shrink:0;}
.user-result-avatar img{width:100%;height:100%;object-fit:cover;}
.user-result-info{flex:1;}
.user-result-nick{font-weight:700;font-size:.92rem;}
.user-result-id{font-size:.78rem;color:var(--gray);}

/* UPLOAD MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-sheet{background:var(--white);border-radius:24px 24px 0 0;width:100%;max-width:480px;padding:24px 20px 40px;animation:slideUp .3s ease;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px;}
.modal-title{font-weight:900;font-size:1.1rem;margin-bottom:18px;color:var(--dark);}
.upload-textarea{width:100%;min-height:120px;border:2px solid var(--border);border-radius:12px;padding:14px;font-size:.93rem;font-family:inherit;resize:none;outline:none;transition:.2s;background:var(--primary-bg);line-height:1.6;}
.upload-textarea:focus{border-color:var(--primary);background:var(--white);}
.char-count{text-align:right;font-size:.78rem;color:var(--gray);margin-top:4px;}
.char-count.over{color:var(--danger);}
.upload-imgs-preview{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.upload-img-thumb{position:relative;width:80px;height:80px;border-radius:10px;overflow:hidden;}
.upload-img-thumb img{width:100%;height:100%;object-fit:cover;}
.upload-img-remove{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.5);color:var(--white);border:none;border-radius:50%;width:20px;height:20px;font-size:.75rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.upload-actions{display:flex;align-items:center;justify-content:space-between;margin-top:14px;}
.upload-img-btn{display:flex;align-items:center;gap:6px;color:var(--primary);font-size:.88rem;font-weight:600;cursor:pointer;padding:8px 12px;border-radius:8px;transition:.15s;border:none;background:none;font-family:inherit;}
.upload-img-btn:hover{background:var(--primary-bg);}
.post-btn{background:var(--primary);color:var(--white);border:none;padding:10px 24px;border-radius:20px;font-weight:700;font-size:.9rem;cursor:pointer;transition:.2s;font-family:inherit;}
.post-btn:hover{background:var(--primary-dark);}
.post-btn:disabled{opacity:.5;cursor:not-allowed;}

/* NOTIFICATIONS */
.notif-list{padding:0;}
.notif-item{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);transition:.15s;}
.notif-item.unread{background:var(--primary-bg);}
.notif-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.1rem;}
.notif-text{font-size:.88rem;line-height:1.5;}
.notif-text strong{font-weight:700;cursor:pointer;color:var(--primary);}
.notif-time{font-size:.72rem;color:var(--gray);margin-top:3px;}
.notif-empty{text-align:center;padding:60px 20px;color:var(--gray);font-size:.9rem;}

/* PROFILE */
.profile-header{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);padding:30px 20px 24px;position:relative;text-align:center;}
.profile-big-avatar{width:88px;height:88px;border-radius:50%;border:4px solid var(--white);background:var(--white);margin:0 auto 12px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:900;color:var(--primary);box-shadow:0 4px 20px rgba(0,0,0,.15);cursor:pointer;position:relative;}
.profile-big-avatar img{width:100%;height:100%;object-fit:cover;}
.profile-big-avatar .edit-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;color:var(--white);font-size:.7rem;font-weight:700;border-radius:50%;}
.profile-big-avatar:hover .edit-overlay{display:flex;}
.profile-display-name{font-size:1.3rem;font-weight:900;color:var(--white);}
.profile-id-text{font-size:.82rem;color:rgba(255,255,255,.8);margin-top:2px;}
.profile-bio{font-size:.85rem;color:rgba(255,255,255,.9);margin-top:8px;max-width:280px;margin-left:auto;margin-right:auto;}
.profile-stats{display:flex;justify-content:center;gap:32px;margin-top:16px;}
.profile-stat{text-align:center;cursor:pointer;}
.profile-stat-num{font-size:1.2rem;font-weight:900;color:var(--white);}
.profile-stat-label{font-size:.72rem;color:rgba(255,255,255,.8);}
.profile-visitor{font-size:.75rem;color:rgba(255,255,255,.75);margin-top:10px;}
.profile-actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
.profile-action-btn{padding:8px 22px;border-radius:20px;font-weight:700;font-size:.88rem;cursor:pointer;transition:.2s;font-family:inherit;border:2px solid var(--white);}
.follow-btn{background:var(--white);color:var(--primary);}
.follow-btn.following{background:transparent;color:var(--white);}
.edit-profile-btn{background:transparent;color:var(--white);}
.suspend-btn{background:#e03333;color:var(--white);border-color:#e03333;}
.unsuspend-btn{background:var(--success);color:var(--white);border-color:var(--success);}
.profile-posts{padding:0;}
.bgm-btn{position:absolute;top:12px;right:12px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.6);color:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.15rem;transition:.2s;backdrop-filter:blur(4px);}
.bgm-btn:hover{background:rgba(255,255,255,.4);}
.bgm-btn.playing{background:rgba(255,255,255,.9);color:var(--primary);animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* EDIT PROFILE MODAL */
.modal-full{position:fixed;inset:0;background:var(--white);z-index:300;display:none;flex-direction:column;}
.modal-full.open{display:flex;}
.modal-full-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);background:var(--white);position:sticky;top:0;z-index:10;}
.modal-full-title{font-weight:900;font-size:1.05rem;}
.modal-back{border:none;background:none;font-size:1.3rem;cursor:pointer;color:var(--dark);padding:4px;}
.modal-save{background:var(--primary);color:var(--white);border:none;padding:8px 18px;border-radius:20px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.88rem;}
.modal-full-body{flex:1;overflow-y:auto;padding:24px 20px;}
.form-group{margin-bottom:18px;}
.form-label{font-size:.82rem;font-weight:700;color:var(--gray);margin-bottom:6px;display:block;letter-spacing:.3px;}
.form-input{width:100%;padding:13px 16px;border:2px solid var(--border);border-radius:12px;font-size:.93rem;font-family:inherit;outline:none;transition:.2s;background:var(--primary-bg);}
.form-input:focus{border-color:var(--primary);background:var(--white);}
.form-textarea{width:100%;padding:13px 16px;border:2px solid var(--border);border-radius:12px;font-size:.93rem;font-family:inherit;outline:none;transition:.2s;background:var(--primary-bg);resize:none;min-height:90px;}
.form-textarea:focus{border-color:var(--primary);background:var(--white);}
.form-hint{font-size:.75rem;color:var(--gray);margin-top:4px;}

/* ADMIN */
.admin-section{padding:16px;}
.admin-card{background:var(--primary-bg);border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid var(--border);}
.admin-card-title{font-weight:700;font-size:.95rem;margin-bottom:10px;color:var(--primary);}
.user-list-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
.user-list-item:last-child{border-bottom:none;}
.user-list-info{font-size:.85rem;}
.user-list-id{font-weight:700;}
.user-list-pw{color:var(--gray);font-size:.78rem;}
.admin-act-btn{padding:5px 12px;border-radius:8px;font-size:.78rem;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:.15s;}
.make-subadmin-btn{background:#9b59b6;color:var(--white);}
.remove-subadmin-btn{background:var(--gray);color:var(--white);}
.suspend-user-btn{background:#e03333;color:var(--white);}
.unsuspend-user-btn{background:var(--success);color:var(--white);}

/* MODALS */
.modal-center{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-center.open{display:flex;}
.modal-box{background:var(--white);border-radius:20px;width:100%;max-width:420px;max-height:70vh;overflow:hidden;display:flex;flex-direction:column;animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-box-header{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-box-title{font-weight:900;font-size:1rem;}
.modal-close{border:none;background:none;font-size:1.4rem;cursor:pointer;color:var(--gray);padding:0;}
.modal-box-body{overflow-y:auto;flex:1;}
.suspend-options{display:flex;flex-direction:column;gap:10px;padding:20px;}
.suspend-option{padding:12px 16px;border-radius:10px;border:2px solid var(--border);cursor:pointer;font-size:.9rem;font-weight:600;text-align:center;transition:.15s;}
.suspend-option:hover{border-color:var(--primary);background:var(--primary-bg);}
.unsuspend-option{border-color:var(--success);color:var(--success);}
.unsuspend-option:hover{background:#f0fff4;}
.perm-option{border-color:#e03333;color:#e03333;}
.perm-option:hover{background:#fff0f0;}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:400;display:none;align-items:center;justify-content:center;}
.lightbox.open{display:flex;}
.lightbox img{max-width:95%;max-height:90vh;border-radius:8px;object-fit:contain;}
.lightbox-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--white);font-size:2rem;cursor:pointer;}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--dark);color:var(--white);padding:10px 20px;border-radius:20px;font-size:.85rem;font-weight:600;z-index:500;opacity:0;transition:.3s;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.save-indicator{position:fixed;bottom:70px;right:10px;font-size:.68rem;color:var(--gray);background:var(--white);border:1px solid var(--border);border-radius:10px;padding:3px 9px;z-index:200;opacity:0;transition:.4s;pointer-events:none;}
.save-indicator.show{opacity:1;}

/* MISC */
.suspended-banner{background:#e03333;color:var(--white);text-align:center;padding:10px 16px;font-size:.85rem;font-weight:700;position:sticky;top:52px;z-index:90;}
.empty-state{text-align:center;padding:60px 20px;color:var(--gray);}
.empty-state .empty-icon{font-size:3rem;margin-bottom:12px;}
.empty-state p{font-size:.9rem;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.inline-edit-area{width:100%;border:2px solid var(--primary);border-radius:10px;padding:10px 12px;font-size:.93rem;font-family:inherit;resize:none;outline:none;background:var(--primary-bg);min-height:60px;}
.inline-edit-actions{display:flex;gap:8px;margin-top:6px;}
.inline-edit-save{background:var(--primary);color:var(--white);border:none;padding:6px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.82rem;}
.inline-edit-cancel{background:var(--border);color:var(--dark);border:none;padding:6px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.82rem;}
.suspended-tag{color:#e03333;font-size:.7rem;font-weight:700;margin-left:4px;}

/* ── DARK MODE ── */
body.dark {
  --primary-bg: #2a1520; --primary-pale: #3a1a28; --light-gray: #1a0e13;
  --border: #3d2030; --white: #1e1118; --dark: #f0e0e8; --gray: #b090a0;
  --mid: #d0a0b8;
}
body.dark .post-card, body.dark .top-nav, body.dark .bottom-nav,
body.dark .modal-sheet, body.dark .auth-card, body.dark .modal-full,
body.dark .modal-box, body.dark .comment-body, body.dark .post-dropdown,
body.dark .comment-dropdown { background: #1e1118; }
body.dark .auth-form input, body.dark .form-input, body.dark .form-textarea,
body.dark .upload-textarea, body.dark .comment-input, body.dark .search-bar,
body.dark .inline-edit-area { background: #2a1520; color: #f0e0e8; }
body.dark #auth-screen { background: linear-gradient(135deg,#2a0a1a 0%,#3d1228 50%,#5c1a3a 100%); }
body.dark .story-name, body.dark .post-nickname, body.dark .comment-nick { color: #f0e0e8; }
body.dark .search-section-title { color: #b090a0; }
body.dark .user-result-item:hover, body.dark .post-dropdown-item:hover,
body.dark .comment-dropdown-item:hover { background: #2a1520; }
body.dark .admin-card { background: #2a1520; }
body.dark .suspend-option:hover { background: #2a1520; }
body.dark .post-act-btn:hover { background: #2a1520; }
body.dark .modal-full-body, body.dark .modal-full-header { background: #1e1118; }

/* ── THEME TOGGLE ── */
.theme-toggle {
  background: none; border: none; cursor: pointer; font-size: 1.2rem;
  padding: 4px 8px; border-radius: 8px; transition: .15s; color: var(--gray);
}
.theme-toggle:hover { background: var(--primary-bg); }

/* ── HASHTAG / MENTION ── */
.post-hashtag { color: var(--primary); font-weight: 700; cursor: pointer; }
.post-hashtag:hover { text-decoration: underline; }
.post-mention { color: #17a2b8; font-weight: 700; cursor: pointer; }
.post-mention:hover { text-decoration: underline; }

/* ── HASHTAG PAGE ── */
#page-hashtag { display: none; padding-bottom: calc(var(--nav-h) + 20px); }
#page-hashtag.active { display: block; }
.hashtag-header {
  padding: 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  background: var(--white); position: sticky; top: 52px; z-index: 50;
}
.hashtag-title { font-size: 1.1rem; font-weight: 900; color: var(--primary); }

/* ── POST DETAIL PAGE ── */
#page-post-detail { display: none; padding-bottom: calc(var(--nav-h) + 20px); }
#page-post-detail.active { display: block; }
.detail-header {
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  background: var(--white); position: sticky; top: 52px; z-index: 50;
}

/* ── SHARE BUTTON ── */
.share-modal-body { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.share-option {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px;
  border-radius: 12px; border: 2px solid var(--border); cursor: pointer;
  font-size: .92rem; font-weight: 600; transition: .15s; background: var(--white);
  font-family: inherit; color: var(--dark);
}
.share-option:hover { border-color: var(--primary); background: var(--primary-bg); }
.share-option .share-icon { font-size: 1.3rem; }

/* ── RETWEET LABEL ENHANCED ── */
.retweet-banner {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: .78rem; color: #17a2b8; font-weight: 600; margin-bottom: 8px;
  padding: 6px 10px; background: #e8f8fb; border-radius: 8px;
}
body.dark .retweet-banner { background: #0a2a30; }
.retweet-orig-btn {
  font-size: .75rem; color: #17a2b8; border: 1px solid #17a2b8;
  border-radius: 12px; padding: 2px 10px; cursor: pointer; background: none;
  font-family: inherit; font-weight: 700; white-space: nowrap; transition: .15s;
}
.retweet-orig-btn:hover { background: #17a2b8; color: #fff; }

/* ── POST CLICKABLE ── */
.post-body-wrap { cursor: pointer; }
.post-body-wrap:hover .post-body { color: var(--primary); }

</style>
</head>

<script>
const LS={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};

function initData(){
  if(!LS.get('users'))LS.set('users',[{id:'admin',pw:'admin',nickname:'관리자',bio:'',avatar:'',bgm:'',role:'admin',followers:[],following:[],visitors:0,suspended:false,suspendUntil:null}]);
  if(!LS.get('posts'))LS.set('posts',[]);
  if(!LS.get('notifications'))LS.set('notifications',{});
  if(!LS.get('visitedBy'))LS.set('visitedBy',{});
}
function getUsers(){return LS.get('users')||[]}
function saveUsers(u){LS.set('users',u);showSaveIndicator();}
function getPosts(){return LS.get('posts')||[]}
function savePosts(p){LS.set('posts',p);showSaveIndicator();}
function getNotifs(uid){const n=LS.get('notifications')||{};return n[uid]||[]}
function saveNotifs(uid,arr){const n=LS.get('notifications')||{};n[uid]=arr;LS.set('notifications',n)}
function addNotif(targetUid,notif){if(!currentUser||targetUid===currentUser.id)return;const arr=getNotifs(targetUid);arr.unshift({...notif,id:Date.now()+Math.random(),read:false,time:Date.now()});saveNotifs(targetUid,arr.slice(0,100))}
function getUserById(id){return getUsers().find(u=>u.id===id)}
function updateUser(id,fields){const users=getUsers();const idx=users.findIndex(u=>u.id===id);if(idx>=0){users[idx]={...users[idx],...fields};saveUsers(users)}}
function recordVisit(pid){if(pid===currentUser.id)return;const vb=LS.get('visitedBy')||{};if(!vb[pid])vb[pid]={};vb[pid][currentUser.id]=true;LS.set('visitedBy',vb)}
function getVisitorCount(pid){const vb=LS.get('visitedBy')||{};return Object.keys((vb[pid])||{}).length}

let currentUser=null,uploadImages=[],currentViewedUserId=null,bgmPlaying=false,currentBgmUid=null;

// AUTH
function switchAuthTab(tab){
  document.querySelectorAll('.auth-tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&tab==='login')||(i===1&&tab==='register')));
  document.getElementById('login-form').classList.toggle('active',tab==='login');
  document.getElementById('register-form').classList.toggle('active',tab==='register');
}
function doLogin(){
  const id=document.getElementById('login-id').value.trim();
  const pw=document.getElementById('login-pw').value;
  const remember=document.getElementById('remember-me').checked;
  const msg=document.getElementById('login-msg');
  const user=getUsers().find(u=>u.id===id&&u.pw===pw);
  if(!user){msg.textContent='아이디 또는 비밀번호가 올바르지 않습니다.';return}
  msg.textContent='';currentUser=user;
  LS.set('session',id);
  if(remember)LS.set('rememberSession',id);else LS.set('rememberSession',null);
  enterApp();
}
function doRegister(){
  const id=document.getElementById('reg-id').value.trim();
  const pw=document.getElementById('reg-pw').value;
  const pw2=document.getElementById('reg-pw2').value;
  const nick=document.getElementById('reg-nick').value.trim();
  const msg=document.getElementById('reg-msg');
  if(!id||!pw||!pw2||!nick){msg.textContent='모든 칸을 입력해주세요.';return}
  if(pw!==pw2){msg.textContent='비밀번호가 일치하지 않습니다.';return}
  if(id.length<2){msg.textContent='아이디는 2자 이상이어야 합니다.';return}
  const users=getUsers();
  if(users.find(u=>u.id===id)){msg.textContent='이미 사용 중인 아이디입니다.';return}
  users.push({id,pw,nickname:nick,bio:'',avatar:'',bgm:'',role:'user',followers:[],following:[],visitors:0,suspended:false,suspendUntil:null});
  saveUsers(users);msg.style.color='var(--success)';msg.textContent='회원가입 완료! 로그인해주세요.';
  setTimeout(()=>{msg.textContent='';msg.style.color='var(--danger)';switchAuthTab('login')},1500);
}

function enterApp(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app').style.display='block';
  refreshCurrentUser();checkSuspension();renderTopWelcome();renderUploadAvatar();navTo('home');checkNotifDot();
}
function refreshCurrentUser(){currentUser=getUserById(currentUser.id)}
function checkSuspension(){
  const banner=document.getElementById('suspended-banner');
  if(!currentUser)return;
  if(currentUser.suspended){
    if(currentUser.suspendUntil==='permanent'){banner.style.display='block';banner.textContent='계정이 영구 정지되어 글쓰기/댓글/프로필 변경이 불가합니다.';}

function renderFeed(){
  const section=document.getElementById('feed-section');
  const allPosts=getPosts().slice().reverse();
  const following=currentUser.following||[];
  // Filter out deleted posts from feed
  const visible=allPosts.filter(p=>!p.adminDeleted&&!p.userDeleted);
  const fp=visible.filter(p=>following.includes(p.authorId));
  const mp=visible.filter(p=>p.authorId===currentUser.id);
  const op=visible.filter(p=>!following.includes(p.authorId)&&p.authorId!==currentUser.id);
  const ordered=[...new Map([...fp,...mp,...op].map(p=>[p.id,p])).values()];

tton class="post-act-btn" onclick="toggleComments('${post.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>${(post.comments||[]).length}</button><button class="post-act-btn" onclick="openShare('${post.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></button></div><div class="comments-section" id="comments-section-${post.id}" style="display:none;">${renderCommentsList(post)}${!isSuspended()?`<div class="comment-input-row"><input class="comment-input" id="comment-input-${post.id}" placeholder="댓글 달기..." onkeydown="if(event.key==='Enter')submitComment('${post.id}')"><button class="comment-send" onclick="submitComment('${post.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button></div>`:''}</div>`:''}</div>`;

function toggleLike(postId){const posts=getPosts();const p=posts.find(x=>x.id===postId);if(!p)return;p.likes=p.likes||[];p.dislikes=p.dislikes||[];if(p.likes.includes(currentUser.id)){p.likes=p.likes.filter(x=>x!==currentUser.id)}else{p.likes.push(currentUser.id);p.dislikes=p.dislikes.filter(x=>x!==currentUser.id);if(p.authorId!==currentUser.id)addNotif(p.authorId,{type:'like',from:currentUser.nickname,postId})}savePosts(posts);refreshFeedPost(postId)}
function toggleDislike(postId){const posts=getPosts();const p=posts.find(x=>x.id===postId);if(!p)return;p.dislikes=p.dislikes||[];p.likes=p.likes||[];if(p.dislikes.includes(currentUser.id)){p.dislikes=p.dislikes.filter(x=>x!==currentUser.id)}else{p.dislikes.push(currentUser.id);p.likes=p.likes.filter(x=>x!==currentUser.id)}savePosts(posts);refreshFeedPost(postId)}
function toggleRetweet(postId){
  const posts=getPosts();const orig=posts.find(x=>x.id===postId);
  if(!orig||orig.adminDeleted||orig.userDeleted)return;
  orig.retweets=orig.retweets||[];
  if(orig.retweets.includes(currentUser.id)){
    orig.retweets=orig.retweets.filter(x=>x!==currentUser.id);
    const ri=posts.findIndex(p=>p.retweetOf===postId&&p.authorId===currentUser.id);
    if(ri>=0)posts.splice(ri,1);
    savePosts(posts);showToast('리트윗이 취소되었습니다');
  }else{
    if(orig.authorId===currentUser.id){showToast('자신의 게시물은 리트윗할 수 없습니다');return}
    orig.retweets.push(currentUser.id);
    const rt={id:'rt'+Date.now()+Math.random().toString(36).slice(2,5),authorId:currentUser.id,text:orig.text,images:orig.images||[],createdAt:Date.now(),likes:[],dislikes:[],retweets:[],comments:[],adminDeleted:false,userDeleted:false,retweetOf:postId,retweetOriginalAuthor:orig.authorId};
    posts.push(rt);
    if(orig.authorId!==currentUser.id)addNotif(orig.authorId,{type:'retweet',from:currentUser.nickname,postId});
    savePosts(posts);showToast('리트윗되었습니다!');
  }
  refreshFeedPost(postId);renderFeed();
}

// BGM
function extractYtId(url){if(!url)return null;const m=url.match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]{11})/);return m?m[1]:null}
function toggleBgm(uid,ytUrl){
  const vtId=extractYtId(ytUrl);
  if(!vtId){showToast('유효한 유튜브 링크가 아닙니다');return;}
  if(bgmPlaying&&currentBgmUid===uid){stopBgm();return;}
  stopBgm();
  currentBgmUid=uid;
  const wrap=document.getElementById('yt-player-wrap');
  // Use YouTube IFrame Player API for reliable audio-only autoplay
  wrap.innerHTML=`<div id="yt-iframe-container"></div>`;
  if(typeof YT!=='undefined'&&YT.Player){
    _createYTPlayer(vtId);
  } else {
    // Load YT API if not yet loaded
    if(!document.getElementById('yt-api-script')){
      const s=document.createElement('script');
      s.id='yt-api-script';
      s.src='https://www.youtube.com/iframe_api';
      document.head.appendChild(s);
    }
    window._pendingYtId=vtId;
  }
  bgmPlaying=true;updateBgmBtn(uid,true);showToast('🎵 BGM 재생 중...');
}
window.onYouTubeIframeAPIReady=function(){
  if(window._pendingYtId){_createYTPlayer(window._pendingYtId);window._pendingYtId=null;}
};
let _ytPlayerObj=null;
function _createYTPlayer(vtId){
  const wrap=document.getElementById('yt-player-wrap');
  const div=wrap.querySelector('#yt-iframe-container')||wrap;
  _ytPlayerObj=new YT.Player(div,{
    width:'1',height:'1',videoId:vtId,
    playerVars:{autoplay:1,controls:0,loop:1,playlist:vtId,origin:location.hostname||'localhost'},
    events:{
      onReady:e=>e.target.playVideo(),
      onError:()=>{
        // Fallback: direct embed iframe
        wrap.innerHTML=`<iframe width="1" height="1"
          src="https://www.youtube.com/embed/${vtId}?autoplay=1&controls=0&loop=1&playlist=${vtId}&enablejsapi=1"
          allow="autoplay;encrypted-media" allowfullscreen frameborder="0"></iframe>`;
        showToast('🎵 BGM 재생 중...');
      }
    }
  });
}
function stopBgm(){
  if(_ytPlayerObj){try{_ytPlayerObj.destroy();}catch(e){}_ytPlayerObj=null;}
  document.getElementById('yt-player-wrap').innerHTML='';
  bgmPlaying=false;
  if(currentBgmUid)updateBgmBtn(currentBgmUid,false);
  currentBgmUid=null;
}
function updateBgmBtn(uid,playing){const btn=document.querySelector(`[data-bgm-uid="${uid}"]`);if(btn)btn.className='bgm-btn'+(playing?' playing':'')}

function buildProfileHeader(u,isOwn){

  return`<div class="profile-header" style="position:relative;">${hasBgm?`<button class="bgm-btn" data-bgm-uid="${u.id}" onclick="toggleBgm('${u.id}','${esc(u.bgm)}')">🎵</button>`:''}<div class="profile-big-avatar" ${isOwn?'onclick="openEditProfile()"':''} style="${isOwn?'':'cursor:default;'}">${u.avatar?`<img src="${u.avatar}" alt="">`:`<span>${u.nickname.charAt(0)}</span>`}${isOwn?'<div class="edit-overlay">📷</div>':''}</div><div class="profile-display-name">${esc(u.nickname)}${u.role==='admin'?'<span class="admin-badge" style="margin-left:8px;">관리자</span>':''}${u.role==='subadmin'?'<span class="sub-admin-badge" style="margin-left:8px;">부관리자</span>':''}</div><div class="profile-id-text">@${esc(u.id)}${isSuspendedUser?'<span class="suspended-tag"> [정지됨]</span>':''}</div>${u.bio?`<div class="profile-bio">${esc(u.bio)}</div>`:''}<div class="profile-stats"><div class="profile-stat" onclick="showFollowList('${u.id}','following')"><div class="profile-stat-num">${(u.following||[]).length}</div><div class="profile-stat-label">팔로잉</div></div><div class="profile-stat" onclick="showFollowList('${u.id}','followers')"><div class="profile-stat-num">${(u.followers||[]).length}</div><div class="profile-stat-label">팔로워</div></div></div><div class="profile-visitor">👁 누적 방문자 ${getVisitorCount(u.id)}명</div><div class="profile-actions">${isOwn?`<button class="profile-action-btn edit-profile-btn" onclick="openEditProfile()">프로필 편집</button>${u.role==='admin'?'<button class="profile-action-btn edit-profile-btn" onclick="openAdmin()">관리자 설정</button>':''}<button class="profile-action-btn edit-profile-btn" onclick="doLogout()" style="background:rgba(255,255,255,.15);">로그아웃</button>`:`<button class="profile-action-btn follow-btn ${isFollowing?'following':''}" onclick="toggleFollow('${u.id}')">${isFollowing?'팔로잉':'팔로우'}</button>${(()=>{
  // Admin can suspend anyone except other admins
  // Subadmin can ONLY suspend regular users (not admin, not other subadmins)
  const targetIsProtected = u.role==='admin'||u.role==='subadmin';
  const canAct = isAdmin?(!targetIsProtected):(isSubAdmin&&u.role==='user');
  if(!canAct||u.id==='admin')return'';

    ?`<button class="profile-action-btn unsuspend-btn" onclick="unsuspendUser('${u.id}');renderViewedProfile('${u.id}')">정지 해제</button><button class="profile-action-btn suspend-btn" onclick="openSuspend('${u.id}')">정지 재설정</button>`
    :`<button class="profile-action-btn suspend-btn" onclick="openSuspend('${u.id}')">정지 설정</button>`;
})()}`}</div></div>`;
}

function toggleFollow(userId){refreshCurrentUser();const users=getUsers();const me=users.find(u=>u.id===currentUser.id);const target=users.find(u=>u.id===userId);if(!me||!target)return;me.following=me.following||[];target.followers=target.followers||[];if(me.following.includes(userId)){me.following=me.following.filter(x=>x!==userId);target.followers=target.followers.filter(x=>x!==currentUser.id)}else{me.following.push(userId);target.followers.push(currentUser.id);addNotif(userId,{type:'follow',from:currentUser.nickname})}saveUsers(users);currentUser=me;renderViewedProfile(userId)}

function openEditProfile(){if(isSuspended()){showToast('정지 상태에서는 프로필을 변경할 수 없습니다');return}refreshCurrentUser();document.getElementById('edit-userid').value=currentUser.id;
  // Show last ID change info
  const hint=document.getElementById('userid-change-hint');

      const daysLeft=30-daysSince;
      if(daysLeft>0){hint.textContent=`아이디 변경 후 ${daysSince}일 경과 (${daysLeft}일 후 변경 가능)`;hint.style.color='var(--danger)';}
      else{hint.textContent='아이디 변경 가능합니다';hint.style.color='var(--success)';}
    }else{hint.textContent='아이디 변경 가능합니다';hint.style.color='var(--success)';}
  }
  document.getElementById('edit-nickname').value=currentUser.nickname;document.getElementById('edit-bio').value=currentUser.bio||'';document.getElementById('edit-bgm').value=currentUser.bgm||'';document.getElementById('edit-pw').value='';document.getElementById('edit-pw2').value='';document.getElementById('edit-msg').textContent='';const ai=document.getElementById('edit-avatar-img');const at=document.getElementById('edit-avatar-text');if(currentUser.avatar){ai.src=currentUser.avatar;ai.style.display='block';at.style.display='none'}else{at.textContent=currentUser.nickname.charAt(0);ai.style.display='none';at.style.display='block'}document.getElementById('edit-profile-modal').classList.add('open')}

function saveProfile(){
  const newId=document.getElementById('edit-userid').value.trim();
  const nick=document.getElementById('edit-nickname').value.trim();
  const bio=document.getElementById('edit-bio').value.trim();
  const bgm=document.getElementById('edit-bgm').value.trim();
  const pw=document.getElementById('edit-pw').value;
  const pw2=document.getElementById('edit-pw2').value;
  const msg=document.getElementById('edit-msg');
  if(!nick){msg.textContent='닉네임을 입력해주세요';return}
  if(pw&&pw!==pw2){msg.textContent='비밀번호가 일치하지 않습니다';return}
  if(!newId||newId.length<2){msg.textContent='아이디는 2자 이상이어야 합니다';return}
  // Check id change
  const oldId=currentUser.id;
  if(newId!==oldId){
    const lastChange=currentUser.lastIdChange;
    if(lastChange){const daysSince=Math.floor((Date.now()-lastChange)/(1000*60*60*24));if(daysSince<30){msg.textContent=`아이디는 ${30-daysSince}일 후에 변경할 수 있습니다`;return}}
    const users=getUsers();if(users.find(u=>u.id===newId&&u.id!==oldId)){msg.textContent='이미 사용 중인 아이디입니다';return}
  }
  const ai=document.getElementById('edit-avatar-img');
  const updates={nickname:nick,bio,bgm};
  if(ai.src&&!ai.src.endsWith('/'))updates.avatar=ai.src;
  if(pw)updates.pw=pw;
  if(newId!==oldId){
    updates.id=newId; updates.lastIdChange=Date.now();
    // Update all posts, comments authored by old id
    const posts=getPosts();
    posts.forEach(p=>{if(p.authorId===oldId)p.authorId=newId;(p.comments||[]).forEach(c=>{if(c.authorId===oldId)c.authorId=newId})});
    savePosts(posts);
    // Update followers/following references in all users
    const users=getUsers();
    users.forEach(u=>{
      if(u.following)u.following=u.following.map(x=>x===oldId?newId:x);
      if(u.followers)u.followers=u.followers.map(x=>x===oldId?newId:x);
    });
    saveUsers(users);
    // Update session
    LS.set('session',newId);
    if(LS.get('rememberSession'))LS.set('rememberSession',newId);
  }
  updateUser(newId!==oldId?newId:oldId,updates);
  if(newId!==oldId){currentUser=getUserById(newId);}else{refreshCurrentUser();}
  closeEditProfile();renderTopWelcome();renderUploadAvatar();renderOwnProfile();
  showToast('프로필이 저장되었습니다');
}

function formatDate(ts){const d=new Date(ts),now=new Date(),diff=now-d;if(diff<60000)return'방금 전';if(diff<3600000)return Math.floor(diff/60000)+'분 전';if(diff<86400000)return Math.floor(diff/3600000)+'시간 전';if(diff<604800000)return Math.floor(diff/86400000)+'일 전';return d.toLocaleDateString('ko-KR')}

// ══════════════════════════════
//  DARK MODE
// ══════════════════════════════
function toggleTheme() {
  const dark = document.body.classList.toggle('dark');
  LS.set('darkMode', dark);
  document.getElementById('theme-btn').textContent = dark ? '☀️' : '🌙';
}
function initTheme() {
  if (LS.get('darkMode')) {
    document.body.classList.add('dark');
    const btn = document.getElementById('theme-btn');
    if (btn) btn.textContent = '☀️';
  }
}

// ══════════════════════════════
//  NAV HISTORY
// ══════════════════════════════
let navHistory = [];
function navBack() {
  const prev = navHistory.pop();
  if (prev) {
    document.querySelectorAll('.page, #page-hashtag, #page-post-detail').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    const pe = document.getElementById('page-' + prev);
    if (pe) pe.classList.add('active');
    const ne = document.getElementById('nav-' + prev);
    if (ne) ne.classList.add('active');
  } else {
    navTo('home');
  }
}

// ══════════════════════════════
//  MENTION + HASHTAG RENDERING
// ══════════════════════════════
function renderTextWithLinks(text) {
  if (!text) return '';
  const escaped = esc(text);
  // hashtags: #word
  let result = escaped.replace(/#([\w가-힣]+)/g, (m, tag) =>
    `<span class="post-hashtag" onclick="event.stopPropagation();openHashtagPage('${tag}')">#${tag}</span>`
  );
  // mentions: @userid
  result = result.replace(/@([\w]+)/g, (m, uid) =>
    `<span class="post-mention" onclick="event.stopPropagation();viewProfile('${uid}')">@${uid}</span>`
  );
  return result;
}

// ══════════════════════════════
//  HASHTAG PAGE
// ══════════════════════════════
function openHashtagPage(tag) {
  navHistory.push(getCurrentPage());
  document.querySelectorAll('.page, #page-hashtag, #page-post-detail').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-hashtag').classList.add('active');
  document.getElementById('hashtag-title').textContent = '#' + tag;
  const posts = getPosts().filter(p =>
    !p.adminDeleted && !p.userDeleted && p.text && p.text.includes('#' + tag)
  ).slice().reverse();
  const container = document.getElementById('hashtag-posts');
  if (!posts.length) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><p>이 해시태그의 게시물이 없습니다</p></div>';
    return;
  }
  container.innerHTML = posts.map(p => renderPostCard(p)).join('');
}

function getCurrentPage() {
  const pages = ['home','search','notif','profile','viewed-profile','hashtag','post-detail'];
  for (const p of pages) {
    const el = document.getElementById('page-' + p);
    if (el && el.classList.contains('active')) return p;
  }
  return 'home';
}

// ══════════════════════════════
//  POST DETAIL PAGE
// ══════════════════════════════
function openPostDetail(postId) {
  navHistory.push(getCurrentPage());
  document.querySelectorAll('.page, #page-hashtag, #page-post-detail').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-post-detail').classList.add('active');
  const posts = getPosts();
  const post = posts.find(p => p.id === postId);
  const container = document.getElementById('post-detail-content');
  if (!post) { container.innerHTML = '<div class="empty-state"><p>게시물을 찾을 수 없습니다</p></div>'; return; }
  // Show post + all comments expanded
  container.innerHTML = renderPostCard(post);
  // Auto-open comments
  setTimeout(() => {
    const sec = document.getElementById('comments-section-' + postId);
    if (sec) sec.style.display = 'block';
  }, 50);
}

// ══════════════════════════════
//  SHARE
// ══════════════════════════════
function openShare(postId) {
  document.getElementById('share-modal-body').innerHTML = `
    <button class="share-option" onclick="copyPostLink('${postId}')">
      <span class="share-icon">🔗</span> 링크 복사
    </button>
    <button class="share-option" onclick="copyPostText('${postId}')">
      <span class="share-icon">📋</span> 내용 복사
    </button>
  `;
  document.getElementById('share-modal').classList.add('open');
}
function copyPostLink(postId) {
  const text = `[NYAU 게시물] nyau://post/${postId}`;
  navigator.clipboard.writeText(text).then(() => showToast('링크가 복사되었습니다!')).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('링크가 복사되었습니다!');
  });
  document.getElementById('share-modal').classList.remove('open');
}
function copyPostText(postId) {
  const posts = getPosts();
  const p = posts.find(x => x.id === postId);
  if (!p) return;
  const author = getUserById(p.authorId);
  const text = `[${author ? author.nickname : ''}] ${p.text}\n#NYAU`;
  navigator.clipboard.writeText(text).then(() => showToast('내용이 복사되었습니다!')).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('내용이 복사되었습니다!');
  });
  document.getElementById('share-modal').classList.remove('open');
}

initData();
initTheme();
